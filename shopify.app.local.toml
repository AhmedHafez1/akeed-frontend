# Local-only Shopify development configuration.
# `npm run shopify:dev` also passes --no-update, so this configuration cannot
# replace the live app URL or redirect allowlist during local development.

client_id = "f1f4012b31f1bb37c897ee284a501623"
name = "Akeed Local"
application_url = "https://localhost:3458"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = "zamalek-store-2.myshopify.com"

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/shopify/app-subscriptions/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/shopify/orders-create"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/shopify/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/shopify/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/shopify/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shopify/shop/redact"

[access_scopes]
scopes = "read_customers,write_order_edits,read_orders,write_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://localhost:3458/api/auth/shopify/callback" ]
