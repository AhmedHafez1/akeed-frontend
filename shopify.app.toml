# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1a5206c30b74f6600897545465ee8d13"
name = "Akeed"
application_url = "https://getakeed.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/orders-create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/app-subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  [[webhooks.subscriptions]]
  uri = "https://get-akeed.vercel.app/webhooks/shopify/orders-updated"
  topics = [ "orders/updated" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_order_edits,read_orders,write_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://akeed-backend-production.up.railway.app/api/auth/shopify/callback"
]
